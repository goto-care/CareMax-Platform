<!DOCTYPE html>
<html lang="ja">

<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>備品管理 | CareMax Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=supply-icon-20261116-1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="../auth.js?v=login-gate-20261125"></script>
</head>

<body>
    <div id="demo-banner" class="demo-banner hidden">
        お試しモード：この画面での操作は、このブラウザの中にだけ保存されます（みんなの申請には反映されません）
    </div>

    <!-- App Container（カテゴリーは上のタブ、申請リストは右） -->
    <div id="app" class="app-layout layout-top">
        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-row">
                    <a href="../index.html" class="logo-section">
                        <div class="logo-icon"><img src="supply-icon.svg" alt="" width="36" height="36"></div>
                        <span class="logo-text">備品管理</span>
                    </a>
                    <div class="search-container">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="備品を検索...">
                    </div>
                    <div class="header-actions">
                        <div class="view-switcher">
                            <button onclick="setViewMode('list')" class="view-btn" id="view-list-btn" title="リスト表示"><i
                                    class="fa-solid fa-list"></i></button>
                            <button onclick="setViewMode('small')" class="view-btn" id="view-small-btn" title="小サイズ"><i
                                    class="fa-solid fa-table-cells-large"></i></button>
                            <button onclick="setViewMode('medium')" class="view-btn active" id="view-medium-btn"
                                title="標準表示"><i class="fa-solid fa-table-cells"></i></button>
                            <button onclick="setViewMode('large')" class="view-btn" id="view-large-btn" title="詳細表示"><i
                                    class="fa-solid fa-tablet-screen-button"></i></button>
                        </div>
                        <button class="ghost-button" onclick="toggleHistory()">
                            <i class="fa-solid fa-clock-rotate-left"></i> 注文履歴
                        </button>
                        <button class="primary-button new-item-button" onclick="openItemModal()">
                            <i class="fa-solid fa-plus"></i> 新規登録
                        </button>
                    </div>
                </div>
                <nav class="category-tabs" aria-label="カテゴリー">
                    <div class="nav-item active" onclick="setCategoryFilter('')" id="nav-all">
                        <i class="fa-solid fa-border-all"></i>
                        <span class="nav-item-text">全ての備品</span>
                        <span class="nav-count" id="count-all">0</span>
                    </div>
                    <div class="nav-item" onclick="setCategoryFilter('事務用品')" id="nav-office">
                        <i class="fa-solid fa-pen-nib"></i>
                        <span class="nav-item-text">事務用品</span>
                        <span class="nav-count" id="count-office">0</span>
                    </div>
                    <div class="nav-item" onclick="setCategoryFilter('清掃・衛生')" id="nav-cleaning">
                        <i class="fa-solid fa-spray-can-sparkles"></i>
                        <span class="nav-item-text">清掃・衛生</span>
                        <span class="nav-count" id="count-cleaning">0</span>
                    </div>
                    <div class="nav-item" onclick="setCategoryFilter('飲食')" id="nav-food">
                        <i class="fa-solid fa-mug-hot"></i>
                        <span class="nav-item-text">飲食</span>
                        <span class="nav-count" id="count-food">0</span>
                    </div>
                    <div class="nav-item" onclick="setCategoryFilter('その他')" id="nav-other">
                        <i class="fa-solid fa-box-archive"></i>
                        <span class="nav-item-text">その他</span>
                        <span class="nav-count" id="count-other">0</span>
                    </div>
                    <span class="category-hint">「選択する」で申請リストに入ります</span>
                </nav>
            </header>

            <div class="inventory-container">
                <div id="inventory-grid" class="inventory-grid"></div>
                <div id="inventory-empty" class="inventory-empty hidden">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <p>当てはまる備品がありません</p>
                </div>
            </div>
        </main>

        <!-- Cart Sidebar -->
        <aside class="cart-sidebar" id="cart-sidebar">
            <button type="button" class="cart-header" id="cart-header" onclick="toggleCartSheet()" aria-expanded="false" aria-controls="requests-list">
                <span class="cart-title" role="heading" aria-level="2">
                    <i class="fa-solid fa-inbox" style="color:var(--accent-primary)"></i>
                    申請リスト
                    <span class="cart-count hidden" id="cart-count">0</span>
                </span>
                <span class="cart-sheet-hint" id="cart-sheet-hint">
                    <i class="fa-solid fa-chevron-up"></i>
                </span>
            </button>
            <div id="requests-list" class="cart-items">
                <!-- Cart items here -->
            </div>
            <div class="cart-footer">
                <button id="send-btn" class="primary-button" onclick="sendRequests()" disabled>
                    申請を確定
                </button>
                <a href="https://www.askul.co.jp/" class="askul-order-link" target="_blank" rel="noopener noreferrer">
                    <img src="askul-logo.jpg" alt="ASKUL">
                    <span>で注文する</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>
        </aside>
    </div>

    <!-- Modals -->

    <!-- History Modal -->
    <div id="history-modal" class="modal hidden">
        <div class="modal-content large-modal">
            <div class="modal-header">
                <h2>注文履歴</h2>
                <button class="close-modal-btn" onclick="toggleHistory()" aria-label="閉じる"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body history-body">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>申請日</th>
                            <th>備品名</th>
                            <th>数量</th>
                            <th>申請者</th>
                            <th>完了日</th>
                            <th>備考</th>
                        </tr>
                    </thead>
                    <tbody id="history-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Item Add/Edit Modal -->
    <div id="item-modal" class="modal hidden">
        <div class="modal-content standard-modal">
            <div class="modal-header">
                <h2 id="item-modal-title">備品を登録</h2>
                <button class="close-modal-btn" onclick="closeItemModal()" aria-label="閉じる"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="item-name-input">備品名</label>
                    <input type="text" id="item-name-input" placeholder="例: ボールペン">
                </div>
                <div class="form-group">
                    <label for="item-category-select">カテゴリー</label>
                    <select id="item-category-select">
                        <option value="事務用品">事務用品</option>
                        <option value="清掃・衛生">清掃・衛生</option>
                        <option value="飲食">飲食</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>&#x753b;&#x50cf;</label>
                    <div class="item-image-field">
                        <button type="button" id="item-image-picker-btn" class="item-modal-image-preview" onclick="triggerItemImagePicker()">
                            <div id="item-image-preview" class="item-modal-image-preview-content item-modal-image-placeholder">
                                <div class="item-modal-image-empty">
                                    <i class="fa-regular fa-image"></i>
                                    <span>&#x753b;&#x50cf;&#x3092;&#x307e;&#x3060;&#x767b;&#x9332;&#x3057;&#x3066;&#x3044;&#x307e;&#x305b;&#x3093;</span>
                                    <small>&#x30af;&#x30ea;&#x30c3;&#x30af;&#x3057;&#x3066;&#x753b;&#x50cf;&#x3092;&#x9078;&#x629e;&#x3067;&#x304d;&#x307e;&#x3059;</small>
                                </div>
                            </div>
                        </button>
                        <div class="item-modal-image-actions">
                            <button type="button" class="secondary-inline-btn" onclick="triggerItemImagePicker()">
                                <i class="fa-solid fa-upload"></i> &#x753b;&#x50cf;&#x3092;&#x9078;&#x629e;
                            </button>
                            <button type="button" class="ghost-inline-btn" onclick="clearItemImage()">
                                <i class="fa-solid fa-trash"></i> &#x753b;&#x50cf;&#x3092;&#x524a;&#x9664;
                            </button>
                        </div>
                        <p class="item-image-hint">&#x30ab;&#x30fc;&#x30c9;&#x4e0a;&#x306e;&#x30a2;&#x30a4;&#x30b3;&#x30f3;&#x90e8;&#x5206;&#x304b;&#x3089;&#x3082;&#x753b;&#x50cf;&#x3092;&#x5dee;&#x3057;&#x66ff;&#x3048;&#x3067;&#x304d;&#x307e;&#x3059;&#x3002;</p>
                        <input type="file" id="item-image-file-input" class="hidden" accept="image/*" onchange="handleItemImageSelection(event)">
                        <input type="hidden" id="item-image-url-input">
                    </div>
                </div>
            </div>
            <div class="modal-footer footer-spread">
                <button id="modal-delete-btn" class="delete-link-btn hidden" onclick="deleteItemFromModal()">
                    <i class="fa-solid fa-trash"></i> 削除
                </button>
                <div class="footer-actions">
                    <button class="cancel-btn" onclick="closeItemModal()">キャンセル</button>
                    <button class="save-btn" onclick="saveItem()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Request Modal -->
    <div id="request-modal" class="modal hidden">
        <div class="modal-content standard-modal">
            <div class="modal-header">
                <h2 id="request-modal-title">申請内容</h2>
                <button class="close-modal-btn" onclick="closeRequestModal()" aria-label="閉じる"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <p id="request-item-name" class="modal-subtitle"></p>
                <div class="form-row">
                    <div class="form-group">
                        <label for="request-quantity-input">数量</label>
                        <div class="quantity-field">
                            <button type="button" class="qty-step" onclick="stepQuantity(-1)" aria-label="1つ減らす"><i class="fa-solid fa-minus"></i></button>
                            <input type="number" id="request-quantity-input" min="1" max="999" step="1" value="1" inputmode="numeric">
                            <button type="button" class="qty-step" onclick="stepQuantity(1)" aria-label="1つ増やす"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                    <div class="form-group unit-group">
                        <label for="request-unit-input">単位</label>
                        <input type="text" id="request-unit-input" placeholder="個" maxlength="8" list="unit-options">
                        <datalist id="unit-options">
                            <option value="個"></option>
                            <option value="袋"></option>
                            <option value="箱"></option>
                            <option value="本"></option>
                            <option value="巻"></option>
                            <option value="冊"></option>
                            <option value="パック"></option>
                            <option value="セット"></option>
                        </datalist>
                    </div>
                </div>
                <div class="form-group">
                    <label>急ぎ度</label>
                    <div class="urgency-options" role="radiogroup" aria-label="急ぎ度">
                        <label class="urgency-option urgency-urgent">
                            <input type="radio" name="request-urgency" value="urgent">
                            <span>急ぎ</span>
                        </label>
                        <label class="urgency-option urgency-normal">
                            <input type="radio" name="request-urgency" value="normal" checked>
                            <span>ふつう</span>
                        </label>
                        <label class="urgency-option urgency-later">
                            <input type="radio" name="request-urgency" value="later">
                            <span>次回でOK</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="request-name-input">申請者</label>
                    <input type="text" id="request-name-input" placeholder="例: 後藤" maxlength="20" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="request-comment-input">備考</label>
                    <textarea id="request-comment-input" rows="3" placeholder="例: 色・サイズ・型番、残りの数など"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeRequestModal()">キャンセル</button>
                <button class="save-btn" id="request-confirm-btn" onclick="confirmRequest()">申請リストに追加</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <!-- Firebase SDKs via compat mode for non-module support -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="app.js?v=login-gate-20261125"></script>
</body>

</html>
